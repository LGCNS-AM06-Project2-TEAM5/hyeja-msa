global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: hyeja-services
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitoring
      password_file: /run/secrets/monitoring_password
    static_configs:
      - targets:
          - gateway-service:8000
          - user-service:8081
          - policy-service:8082
          - engagement-service:8083
          - recommendation-service:8084
