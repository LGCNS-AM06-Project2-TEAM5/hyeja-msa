groups:
  - name: hyeja-http
    rules:
      - record: hyeja:http_requests:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
      - record: hyeja:http_latency_seconds:p95
        expr: histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
      - record: hyeja:http_5xx:ratio5m
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) or on (application) (0 * hyeja:http_requests:rate5m)) / clamp_min(hyeja:http_requests:rate5m, 1e-9)
