server:
  port: 8000

spring:
  application:
    name: gateway-service
  profiles:
    default: local
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: recommendation-service
              order: 0
              uri: lb://recommendation-service
              predicates:
                - Path=/api/policies/search
                - Method=GET
            - id: policy-service
              order: 1
              uri: lb://policy-service
              predicates:
                - Path=/api/policies/**,/api/regions,/api/terms/**
            - id: user-service
              order: 2
              uri: lb://user-service
              predicates:
                - Path=/api/members/**
            - id: engagement-service
              order: 3
              uri: lb://engagement-service
              predicates:
                - Path=/api/favorite/**,/api/notification/**
# Eureka 주소는 Config Server의 공통 application.yml에서 가져옵니다.

# User 서비스와 동일한 키 및 Redis 인스턴스/DB를 사용합니다.
jwt:
  secret: ${JWT_SECRET}
