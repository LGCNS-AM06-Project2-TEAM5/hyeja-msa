server:
  port: 8000

spring:
  application:
    name: gateway-service
  profiles:
    default: local
  config:
    import: "configserver:${CONFIG_SERVER_URL:https://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  cloud:
    bus:
      enabled: true
      destination: hyeja-config-bus
      id: ${spring.application.name}:${INSTANCE_ID:${random.uuid}}
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
          auto-create-topics: false
    config:
      uri: ${CONFIG_SERVER_URL:https://localhost:8888}
    gateway:
      server:
        webflux:
          routes:
            - id: recommendation-service
              order: 0
              uri: lb://recommendation-service
              predicates:
                - Path=/api/policies/search
                - Method=GET
            - id: policy-service
              order: 1
              uri: lb://policy-service
              predicates:
                - Path=/api/policies/**,/api/regions,/api/terms/**
            - id: user-service
              order: 2
              uri: lb://user-service
              predicates:
                - Path=/api/members/**
            - id: engagement-service
              order: 3
              uri: lb://engagement-service
              predicates:
                - Path=/api/favorite/**,/api/notification/**
# Eureka 주소는 Config Server의 공통 application.yml에서 가져옵니다.

# User 서비스와 동일한 키 및 Redis 인스턴스/DB를 사용합니다.
jwt:
  secret: ${JWT_SECRET}

internal-auth:
  secret: ${GATEWAY_ENGAGEMENT_SECRET}

---
# Local defaults; Docker environment variables override infrastructure addresses.
logging:
  include-application-name: false
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: 7
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  reactor:
    context-propagation: auto
