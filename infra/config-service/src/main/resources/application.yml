server:
  port: 8888

spring:
  application:
    name: config-service
  cloud:
    bus:
      enabled: true
      destination: hyeja-config-bus
      id: ${spring.application.name}:${INSTANCE_ID:${random.uuid}}
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
          auto-create-topics: false
    config:
      server:
        git:
          uri: https://github.com/LGCNS-AM06-Project2-TEAM5/hyeja-config.git
          default-label: main
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh

config-security:
  admin-username: ${CONFIG_ADMIN_USERNAME:config-admin}
  admin-password: ${CONFIG_ADMIN_PASSWORD}
