server:
  port: 8888
  ssl:
    enabled: true
    enabled-protocols: TLSv1.2,TLSv1.3
    key-store: ${CONFIG_TLS_KEY_STORE}
    key-store-type: PKCS12
    key-store-password: ${CONFIG_TLS_KEY_STORE_PASSWORD}

spring:
  application:
    name: config-service
  cloud:
    bus:
      enabled: true
      destination: hyeja-config-bus
      id: ${spring.application.name}:${INSTANCE_ID:${random.uuid}}
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
          auto-create-topics: false
    config:
      server:
        encrypt:
          enabled: true
          prefix-invalid-properties: true
        git:
          uri: https://github.com/LGCNS-AM06-Project2-TEAM5/hyeja-config.git
          default-label: main
          clone-on-start: true

# These bootstrap secrets must be injected outside the configuration Git repository.
encrypt:
  key: ${CONFIG_ENCRYPT_KEY}

config-security:
  allowed-profiles: ${CONFIG_ALLOWED_PROFILES:default,local,dev,docker}
  allowed-labels: main
  readers:
    gateway-service:
      username: ${CONFIG_GATEWAY_USERNAME:config-gateway}
      password: ${CONFIG_GATEWAY_PASSWORD}
    user-service:
      username: ${CONFIG_USER_USERNAME:config-user}
      password: ${CONFIG_USER_PASSWORD}
    policy-service:
      username: ${CONFIG_POLICY_USERNAME:config-policy}
      password: ${CONFIG_POLICY_PASSWORD}
    engagement-service:
      username: ${CONFIG_ENGAGEMENT_USERNAME:config-engagement}
      password: ${CONFIG_ENGAGEMENT_PASSWORD}
    recommendation-service:
      username: ${CONFIG_RECOMMENDATION_USERNAME:config-recommendation}
      password: ${CONFIG_RECOMMENDATION_PASSWORD}
  admin-username: ${CONFIG_ADMIN_USERNAME:config-admin}
  admin-password: ${CONFIG_ADMIN_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
  endpoint:
    health:
      show-details: never

# Upstream decrypt-error logging includes request content; never log that payload.
logging:
  level:
    org.springframework.cloud.config.server.encryption.EncryptionController: "OFF"
