name: Commit Check

# 커밋과 PR 설명에서 AI 도구의 공동 작성자·생성 표시를 자동으로 정리합니다.
# push·PR이 올라올 때 바로 실행되고, 놓친 경우를 대비해 10분마다 모든 작업 브랜치와 열린 PR을 다시 확인합니다.

on:
  push:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: write

concurrency:
  group: commit-check-${{ github.head_ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  commit-check:
    name: commit-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check and clean
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_USER_ID: ${{ github.event.pull_request.user.id }}
        run: bash .github/scripts/commit-check.sh
