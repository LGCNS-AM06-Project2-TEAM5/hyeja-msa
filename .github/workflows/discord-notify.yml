name: Discord Notify

# 이슈·PR·리뷰·머지 소식을 담당 서비스의 디스코드 채널로 보냅니다(.github/scripts/discord-notify.py).

on:
  issues:
    types: [opened, closed, reopened, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # CodeRabbit 같은 봇의 댓글은 채널을 어지럽히지 않게 보내지 않습니다.
    if: github.event.sender.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/discord-notify.py
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_MSA_INFRA: ${{ secrets.DISCORD_WEBHOOK_MSA_INFRA }}
          DISCORD_WEBHOOK_MSA_USER: ${{ secrets.DISCORD_WEBHOOK_MSA_USER }}
          DISCORD_WEBHOOK_MSA_POLICY: ${{ secrets.DISCORD_WEBHOOK_MSA_POLICY }}
          DISCORD_WEBHOOK_MSA_ENGAGEMENT: ${{ secrets.DISCORD_WEBHOOK_MSA_ENGAGEMENT }}
          DISCORD_WEBHOOK_MSA_RECOMMENDATION: ${{ secrets.DISCORD_WEBHOOK_MSA_RECOMMENDATION }}
          DISCORD_WEBHOOK_MSA_COMMON: ${{ secrets.DISCORD_WEBHOOK_MSA_COMMON }}
