name: CI

# 바뀐 서비스(services/*, infra/*)만 골라 Java 17로 테스트와 bootJar 빌드를 합니다.
# develop·main에 들어간 커밋은 모든 서비스를 빌드합니다.

on:
  # 앞 PR 브랜치 위에 쌓아 올린 PR(base가 develop이 아닌 PR)도 검사하도록 base 브랜치를 제한하지 않습니다.
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 서비스 찾기
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          all=$(find services infra -mindepth 2 -maxdepth 2 -name build.gradle -exec dirname {} \; 2>/dev/null | sort)
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            picked=$(for d in $all; do if echo "$changed" | grep -q "^$d/"; then echo "$d"; fi; done)
          else
            picked=$all
          fi
          json=$(printf '%s\n' "$picked" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $json"

  build:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: ${{ matrix.service }}/**/*.gradle*
      - name: 테스트와 빌드
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
      - name: 테스트 결과 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ strategy.job-index }}
          path: ${{ matrix.service }}/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
