<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>혜자 인증 코드</title>
</head>
<body style="margin:0; padding:0; background-color:#F3F5F8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F3F5F8;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:480px; background-color:#FFFFFF; border-radius:16px;
                      font-family:Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#0B1626;">
          <tr>
            <td style="padding:32px 32px 0;">
              <span style="font-size:22px; font-weight:800; letter-spacing:-0.5px;">혜자</span>
              <span style="font-size:22px; font-weight:800; color:#5CB8FF;">.</span>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 0;">
              <h1 style="margin:0; font-size:20px; font-weight:700; line-height:1.4;">이메일 인증 코드를 알려드려요</h1>
              <p style="margin:12px 0 0; font-size:15px; line-height:1.6; color:#4A5566;">
                혜자 회원가입을 계속하려면 아래 코드를 회원가입 화면에 입력해 주세요.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 0;">
              <div style="background-color:#EAF6FF; border-radius:12px; padding:20px 0; text-align:center;
                          font-size:32px; font-weight:800; letter-spacing:8px; color:#0B1626;">{{code}}</div>
              <p style="margin:12px 0 0; font-size:13px; color:#4A5566; text-align:center;">
                이 코드는 <strong style="color:#0B1626;">{{minutes}}분</strong> 동안만 쓸 수 있어요.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 32px;">
              <p style="margin:0; padding-top:20px; border-top:1px solid #E5E9EF; font-size:13px; line-height:1.6; color:#8A94A6;">
                혜자에 가입하려고 한 적이 없다면 이 메일은 무시해 주세요.<br>
                코드를 다른 사람에게 알려주지 마세요.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0; font-size:12px; color:#8A94A6;
                  font-family:Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
          혜자 · 청년 주거 정책 추천 서비스 · 발신 전용 메일이에요
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
