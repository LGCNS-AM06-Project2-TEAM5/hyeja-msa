# 로컬 개발용 H2 (파일 모드: 재시작해도 데이터가 남습니다)
spring:
  # 어느 DB에 붙을지 설정
  datasource:
    # H2 드라이버 사용
    driver-class-name: org.h2.Driver
    # 저장 위치
    url: jdbc:h2:file:./data/user_db;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  # h2.console: 브라우저로 DB 보기
  h2:
    console:
      enabled: true
      path: /h2-console

  # 테이블 생성과 sql 로그
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
