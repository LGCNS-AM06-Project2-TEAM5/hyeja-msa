spring:
  cloud:
    openfeign:
      client:
        config:
          policy-service:
            connect-timeout: ${POLICY_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${POLICY_READ_TIMEOUT_MS:2000}
    bus:
      enabled: true
      destination: hyeja-config-bus
      id: ${spring.application.name}:${INSTANCE_ID:${random.uuid}}
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
          auto-create-topics: false
    config:
      uri: ${CONFIG_SERVER_URL:https://localhost:8888}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  application:
    name: engagement-service
  profiles:
    default: dev

# F5 Feign 호출(PolicySnapshotReader)에 독립 회로를 둡니다.
# 최근 20회 중 10회 이상 기록되고 절반 이상 실패하면 15초간 호출을 막고, 다음 호출부터 3회 시험해 닫거나 다시 엽니다.
# 4xx(POLICY_001 포함)는 실패율에서 뺍니다. Timeout은 위 openfeign 설정을 그대로 쓰고 Retry는 두지 않습니다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: false
        ignore-exception-predicate: com.hyeja.engagementservice.client.policy.CircuitBreakerIgnorePredicate
    instances:
      engPolicySnapshot:
        base-config: default

server:
  port: 0

internal-auth:
  secret: ${GATEWAY_ENGAGEMENT_SECRET}

admin:
  email: ${ADMIN_ALERT_EMAIL:}
  dlt-threshold: ${ADMIN_DLT_THRESHOLD:3}
  dlt-retry-interval-ms: ${ADMIN_DLT_RETRY_INTERVAL_MS:60000}

---
spring:
  config:
    activate:
      on-profile: "!test"
    # 테스트 외 실행에서는 환경변수로 지정한 Config Server를 조회합니다.
    # Config Server가 없어도 기동할 수 있도록 optional을 유지합니다.
    import: "optional:configserver:${CONFIG_SERVER_URL:https://localhost:8888}"

---
# Local defaults; Docker environment variables override infrastructure addresses.
logging:
  include-application-name: false
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: 7
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
