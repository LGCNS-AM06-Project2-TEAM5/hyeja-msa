spring:
  cloud:
    bus:
      enabled: true
      destination: hyeja-config-bus
      id: ${spring.application.name}:${INSTANCE_ID:${random.uuid}}
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
          auto-create-topics: false
    config:
      uri: ${CONFIG_SERVER_URL:https://localhost:8888}
    # F1/F2/F3 use the Eureka service names; preserve existing timeout and decoder settings.
    # No retries or fallback-to-empty responses are configured.
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}
          user-service:
            error-decoder: com.hyeja.recommendationservice.profile.client.UserServiceErrorDecoder
  application:
    name: recommendation-service

  # Config Server(8888)에서 외부 설정을 불러옴
  # optional: 을 붙여 Config Server가 실행 중이 아니어도 애플리케이션이 기동되도록 설정
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:https://localhost:8888}"

  # 1차와 같은 키 이름입니다. 값은 .env의 OPEN_AI_KEY·OPEN_AI_MODEL로만 넣습니다.
  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
      chat:
        options:
          model: ${OPEN_AI_MODEL}


# 검색 API(GET /api/policies/search)는 서비스 간 인증 계약이 반영될 때까지 꺼 둡니다. F1·F2·F3 Feign Client는 구현됐습니다.
# 켜면 OPEN_AI_KEY·OPEN_AI_MODEL이 있어야 기동됩니다. 인증 없이는 engagement가 F3를 401로 막아 관심 표시 없이 응답합니다.
recommendation:
  search:
    enabled: false

# F1·F2·F3 Feign 호출마다 독립 회로를 둡니다(ProfileClientAdapter·PolicyClientAdapter·FavoriteClientAdapter).
# 최근 20회 중 10회 이상 기록되고 절반 이상 실패하면 15초간 호출을 막고, 다음 호출부터 3회 시험해 닫거나 다시 엽니다.
# 4xx·MEMBER_001·PROFILE_001은 실패율에서 뺍니다. Timeout은 위 openfeign 설정을 그대로 쓰고 Retry는 두지 않습니다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: false
        ignore-exception-predicate: com.hyeja.recommendationservice.global.config.CircuitBreakerIgnorePredicate
    instances:
      recUserProfile:
        base-config: default
      recPolicyCandidates:
        base-config: default
      recEngagementFavorites:
        base-config: default

server:
  port: 0

---
# Local defaults; Docker environment variables override infrastructure addresses.
logging:
  include-application-name: false
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: 7
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
