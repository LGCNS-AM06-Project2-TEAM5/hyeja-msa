spring:
  application:
    name: policy-service

  # 프로필을 지정하지 않으면 로컬 개발 설정을 사용합니다.
  profiles:
    default: dev

  # Config Server(8888)에서 외부 설정을 불러옴
  # optional: Config Server가 실행 중이 아니어도 애플리케이션 기동 가능
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:https://localhost:8888}"

  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
      chat:
        options:
          model: ${OPEN_AI_MODEL}

  # 다른 서비스 내부 API(Feign). 오래 기다리지 않고 실패 처리(F6 상세는 비로그인 응답으로 대신)
  cloud:
    bus:
      enabled: true
      destination: hyeja-config-bus
      id: ${spring.application.name}:${INSTANCE_ID:${random.uuid}}
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
          auto-create-topics: false
    config:
      uri: ${CONFIG_SERVER_URL:https://localhost:8888}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000

# F4·F6 Feign 호출마다 독립 회로를 둡니다(FavoriteReader·MemberProfileReader).
# 최근 20회 중 10회 이상 기록되고 절반 이상 실패하면 15초간 호출을 막고, 다음 호출부터 3회 시험해 닫거나 다시 엽니다.
# 4xx(MEMBER_001·PROFILE_001 포함)는 실패율에서 뺍니다. Timeout은 위 openfeign 설정을 그대로 쓰고 Retry는 두지 않습니다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: false
        ignore-exception-predicate: com.hyeja.policyservice.client.CircuitBreakerIgnorePredicate
    instances:
      policyEngagementFavorites:
        base-config: default
      policyUserProfile:
        base-config: default

server:
  # 실행 시 사용 가능한 랜덤 포트 자동 할당
  port: 0

youth:
  api:
    key: ${YOUTH_API_KEY}
    url: https://www.youthcenter.go.kr/go/ythip/getPlcy

---
# Local defaults; Docker environment variables override infrastructure addresses.
logging:
  include-application-name: false
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: 7
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
