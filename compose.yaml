name: hyeja

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-docker}
  SPRING_CONFIG_IMPORT: configserver:https://config-service:8888
  CONFIG_SERVER_URL: https://config-service:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "0"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
  SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED: "true"
  # Keep each Spring JVM predictable when the full stack runs in Docker Desktop.
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

x-config-client-environment: &config-client-environment
  <<: *app-environment
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MONITORING_USERNAME: monitoring
  MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Set a separate MONITORING_PASSWORD (16+ characters)}
  SPRING_CLOUD_CONFIG_URI: https://config-service:8888
  SPRING_CLOUD_CONFIG_TLS_ENABLED: "true"
  SPRING_CLOUD_CONFIG_TLS_TRUST_STORE: file:/run/config-trust/truststore.p12
  SPRING_CLOUD_CONFIG_TLS_TRUST_STORE_TYPE: PKCS12
  SPRING_CLOUD_CONFIG_TLS_TRUST_STORE_PASSWORD: ${CONFIG_TLS_TRUST_STORE_PASSWORD:?Set CONFIG_TLS_TRUST_STORE_PASSWORD}

x-business-environment: &business-environment
  <<: *config-client-environment
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 UTF-8 bytes)}

x-app: &app
  restart: unless-stopped
  init: true
  deploy:
    resources:
      limits:
        memory: 384M
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${SERVER_PORT}/actuator/health > /dev/null"]
    interval: 10s
    timeout: 5s
    start_period: 90s
    retries: 12

x-business-dependencies: &business-dependencies
  config-service:
    condition: service_healthy
  mariadb:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully
  zipkin:
    condition: service_started

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      POLICY_DB_PASSWORD: ${POLICY_DB_PASSWORD:?Set POLICY_DB_PASSWORD in .env}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:?Set ENGAGEMENT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MARIADB_HOST_PORT:-13306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-128M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx192m"
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - |
        for topic in member-registered policy-updated policy-updated-dlt notification-created member-withdrawn member-withdrawn-dlt hyeja-config-bus; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  zipkin:
    image: openzipkin/zipkin:3.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZIPKIN_HOST_PORT:-9411}:9411"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m"
    deploy:
      resources:
        limits:
          memory: 384M

  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    secrets:
      - monitoring_password
    depends_on:
      gateway-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      engagement-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy

  discovery-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/discovery-service/Dockerfile
    environment:
      <<: *app-environment
      SPRING_CONFIG_IMPORT: ""
      SERVER_PORT: "8761"
      EUREKA_INSTANCE_HOSTNAME: discovery-service
    ports:
      - "127.0.0.1:${DISCOVERY_HOST_PORT:-8761}:8761"
    depends_on:
      zipkin:
        condition: service_started

  config-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/config-service/Dockerfile
    environment:
      <<: *app-environment
      SPRING_CONFIG_IMPORT: ""
      SERVER_PORT: "8888"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/LGCNS-AM06-Project2-TEAM5/hyeja-config.git}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_GIT_LABEL:-main}
      CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY:?Set a separate CONFIG_ENCRYPT_KEY (32+ UTF-8 bytes)}
      CONFIG_TLS_KEY_STORE: file:/run/config-server-tls/server.p12
      CONFIG_TLS_KEY_STORE_PASSWORD: ${CONFIG_TLS_KEY_STORE_PASSWORD:?Set CONFIG_TLS_KEY_STORE_PASSWORD}
      CONFIG_GATEWAY_USERNAME: ${CONFIG_GATEWAY_USERNAME:-config-gateway}
      CONFIG_GATEWAY_PASSWORD: ${CONFIG_GATEWAY_PASSWORD:?Set CONFIG_GATEWAY_PASSWORD}
      CONFIG_USER_USERNAME: ${CONFIG_USER_USERNAME:-config-user}
      CONFIG_USER_PASSWORD: ${CONFIG_USER_PASSWORD:?Set CONFIG_USER_PASSWORD}
      CONFIG_POLICY_USERNAME: ${CONFIG_POLICY_USERNAME:-config-policy}
      CONFIG_POLICY_PASSWORD: ${CONFIG_POLICY_PASSWORD:?Set CONFIG_POLICY_PASSWORD}
      CONFIG_ENGAGEMENT_USERNAME: ${CONFIG_ENGAGEMENT_USERNAME:-config-engagement}
      CONFIG_ENGAGEMENT_PASSWORD: ${CONFIG_ENGAGEMENT_PASSWORD:?Set CONFIG_ENGAGEMENT_PASSWORD}
      CONFIG_RECOMMENDATION_USERNAME: ${CONFIG_RECOMMENDATION_USERNAME:-config-recommendation}
      CONFIG_RECOMMENDATION_PASSWORD: ${CONFIG_RECOMMENDATION_PASSWORD:?Set CONFIG_RECOMMENDATION_PASSWORD}
      CONFIG_ADMIN_USERNAME: ${CONFIG_ADMIN_USERNAME:-config-admin}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:?Set a separate CONFIG_ADMIN_PASSWORD (16+ characters)}
      CONFIG_ALLOWED_PROFILES: ${CONFIG_ALLOWED_PROFILES:-default,local,dev,docker,debug}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,busrefresh
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: config-service
      EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED: "false"
      EUREKA_INSTANCE_SECURE_PORT_ENABLED: "true"
      EUREKA_INSTANCE_SECURE_PORT: "8888"
    volumes:
      - ./docker/config-tls/server:/run/config-server-tls:ro
      - ./docker/config-tls/trust/ca.crt:/run/config-ca/ca.crt:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/run/config-ca/ca.crt", "https://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    ports:
      - "127.0.0.1:${CONFIG_HOST_PORT:-8888}:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  gateway-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/gateway-service/Dockerfile
    environment:
      <<: *config-client-environment
      SPRING_CLOUD_CONFIG_NAME: gateway-service
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_GATEWAY_USERNAME:-config-gateway}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_GATEWAY_PASSWORD:?Set CONFIG_GATEWAY_PASSWORD}
      SERVER_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 UTF-8 bytes)}
      GATEWAY_ENGAGEMENT_SECRET: ${GATEWAY_ENGAGEMENT_SECRET:?Set a separate internal JWT key (at least 32 UTF-8 bytes)}
    volumes:
      - ./docker/config-tls/trust:/run/config-trust:ro
      - gateway-logs:/app/logs
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8000"
    # Netty/native buffers and Spring Cloud metadata need more headroom than the JVM heap alone.
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  user-service:
    <<: *app
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: *business-environment
      SPRING_CLOUD_CONFIG_NAME: user-service
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_USER_USERNAME:-config-user}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_USER_PASSWORD:?Set CONFIG_USER_PASSWORD}
      SERVER_PORT: "8081"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: user_db
      DB_USERNAME: user_app
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/user_db
      SPRING_DATASOURCE_USERNAME: user_app
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      # Mail settings in application-dev.yml are not loaded by the docker profile.
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "5000"
      # Local Compose readiness must not require external SMTP credentials/connectivity.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./docker/config-tls/trust:/run/config-trust:ro
      - user-logs:/app/logs
    # 384M에서는 켜 두기만 해도 상한에 붙어 OOM(137)으로 재시작해서 gateway와 같은 512M로 둡니다.
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on: *business-dependencies

  policy-service:
    <<: *app
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    environment:
      <<: *business-environment
      SPRING_CLOUD_CONFIG_NAME: policy-service
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_POLICY_USERNAME:-config-policy}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_POLICY_PASSWORD:?Set CONFIG_POLICY_PASSWORD}
      SERVER_PORT: "8082"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: policy_db
      DB_USERNAME: policy_app
      DB_PASSWORD: ${POLICY_DB_PASSWORD:?Set POLICY_DB_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/policy_db
      SPRING_DATASOURCE_USERNAME: policy_app
      SPRING_DATASOURCE_PASSWORD: ${POLICY_DB_PASSWORD:?Set POLICY_DB_PASSWORD in .env}
      OPEN_AI_KEY: ${OPEN_AI_KEY:-}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-gpt-4o-mini}
      YOUTH_API_KEY: ${YOUTH_API_KEY:-}
    volumes:
      - ./docker/config-tls/trust:/run/config-trust:ro
      - policy-logs:/app/logs
    # Policy synchronization and Spring Cloud components use significant off-heap memory at startup.
    deploy:
      resources:
        limits:
          memory: 640M
    depends_on: *business-dependencies

  engagement-service:
    <<: *app
    build:
      context: .
      dockerfile: services/engagement-service/Dockerfile
    environment:
      <<: *business-environment
      SPRING_CLOUD_CONFIG_NAME: engagement-service
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_ENGAGEMENT_USERNAME:-config-engagement}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_ENGAGEMENT_PASSWORD:?Set CONFIG_ENGAGEMENT_PASSWORD}
      SERVER_PORT: "8083"
      GATEWAY_ENGAGEMENT_SECRET: ${GATEWAY_ENGAGEMENT_SECRET:?Set a separate internal JWT key (at least 32 UTF-8 bytes)}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: engagement_db
      DB_USERNAME: engagement_app
      DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:?Set ENGAGEMENT_DB_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/engagement_db
      SPRING_DATASOURCE_USERNAME: engagement_app
      SPRING_DATASOURCE_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:?Set ENGAGEMENT_DB_PASSWORD in .env}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      ADMIN_DLT_THRESHOLD: ${ADMIN_DLT_THRESHOLD:-3}
      ADMIN_DLT_RETRY_INTERVAL_MS: ${ADMIN_DLT_RETRY_INTERVAL_MS:-60000}
      # Compose readiness must not depend on the external SMTP server.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    volumes:
      - ./docker/config-tls/trust:/run/config-trust:ro
      - engagement-logs:/app/logs
    # Kafka consumers, Hibernate and Spring Cloud need native-memory headroom above -Xmx256m.
    deploy:
      resources:
        limits:
          memory: 640M
    depends_on: *business-dependencies

  recommendation-service:
    <<: *app
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    environment:
      <<: *business-environment
      SPRING_CLOUD_CONFIG_NAME: recommendation-service
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_RECOMMENDATION_USERNAME:-config-recommendation}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_RECOMMENDATION_PASSWORD:?Set CONFIG_RECOMMENDATION_PASSWORD}
      SERVER_PORT: "8084"
      OPEN_AI_KEY: ${OPEN_AI_KEY:-}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-gpt-4o-mini}
    volumes:
      - ./docker/config-tls/trust:/run/config-trust:ro
      - recommendation-logs:/app/logs
    depends_on: *business-dependencies

secrets:
  monitoring_password:
    environment: MONITORING_PASSWORD

volumes:
  mariadb-data:
  redis-data:
  gateway-logs:
  user-logs:
  policy-logs:
  engagement-logs:
  recommendation-logs:
  prometheus-data:
  kafka-data:
